<!DOCTYPE html>
<html lang="am" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Car Lottery</title>
<meta name="description" content="Car Lottery">
<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────── */
:root{
  --bg:#0d0d0d; --surface:#1b1b1b; --surface-2:#262626; --line:#2c2c2c;
  --text:#f4f4f4; --muted:#8d8d8d;
  --amber:#f5a623; --amber-text:#f5a623; --amber-ink:#1a1100; --amber-tint:rgba(245,166,35,.14);
  --leaf:#1fa971;
  --radius:20px; --radius-sm:14px;
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Abyssinica SIL",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f5f5f4; --surface:#ffffff; --surface-2:#ececea; --line:#dedcd8;
  --text:#161616; --muted:#6b6b6b;
  --amber:#f5a623; --amber-text:#a35f00; --amber-ink:#1a1100; --amber-tint:rgba(245,166,35,.16);
}

/* ── BASE ──────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── HEADER ────────────────────────────────────────────────── */
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand-mark{flex:none;width:52px;height:52px;border-radius:16px;background:var(--amber);color:var(--amber-ink);
  display:grid;place-items:center}
.brand-name{font-weight:700;font-size:17px;line-height:1.15;color:var(--amber-text);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{position:relative;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px}
.pill select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:0;
  padding-right:16px;font-weight:600;cursor:pointer;max-width:112px}
.pill select option{color:#161616}
.pill .chev{position:absolute;right:12px;pointer-events:none;color:var(--muted)}
.icon-btn{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--amber-text);cursor:pointer}
.icon-btn:active{transform:scale(.94)}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── PAGE AREA ─────────────────────────────────────────────── */
main{padding:4px 16px 150px;max-width:640px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;margin-bottom:6px;
  background:none;border:0;color:var(--muted);cursor:pointer;font-weight:500}
.back[hidden]{display:none}
.view{display:none}
.view.is-active{display:block}
.view h1{margin:6px 0 4px;font-size:26px;line-height:1.2}
.view .sub{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.scaffold{border-style:dashed;color:var(--muted);text-align:center;padding:36px 20px}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:36px 0 0}

/* ── BOTTOM NAV ────────────────────────────────────────────── */
.nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:608px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;min-height:64px;
  background:transparent;border:1px solid transparent;border-radius:20px;color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.nav button[aria-current="page"]{background:var(--amber-tint);border-color:var(--amber);color:var(--amber-text)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3"/><path d="M12 13v4"/><path d="M8 21h8M10 17h4v4h-4z"/></svg>
    </div>
    <div class="brand-name" id="brandName"></div>
  </div>

  <label class="pill" id="langPill">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    <select id="langSelect" aria-label="Language">
      <option value="am">አማርኛ</option>
      <option value="om">Afaan Oromoo</option>
      <option value="en">English</option>
    </select>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </label>

  <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme"></button>
</header>

<main>
  <button class="back" id="backBtn" type="button" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span data-i18n="back"></span>
  </button>

  <section class="view" id="view-home">
    <h1 data-i18n="homeTitle"></h1>
    <p class="sub" data-i18n="homeSub"></p>
    <div class="card scaffold">Step 2 goes here: the list of cars.</div>
  </section>

  <section class="view" id="view-tickets">
    <h1 data-i18n="ticketsTitle"></h1>
    <p class="sub" data-i18n="ticketsSub"></p>
    <div class="card scaffold">Step 6 goes here: search tickets by phone number.</div>
  </section>

  <section class="view" id="view-profile">
    <h1 data-i18n="profileTitle"></h1>
    <p class="sub" data-i18n="profileSub"></p>
    <div class="card scaffold">Later: phone number and saved details.</div>
  </section>

  <div class="footer" id="footer"></div>
</main>

<nav class="nav" id="nav" aria-label="Main">
  <button type="button" data-route="home">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    <span data-i18n="navHome"></span>
  </button>
  <button type="button" data-route="tickets">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3z"/><path d="M14 6v12" stroke-dasharray="2 3"/></svg>
    <span data-i18n="navTickets"></span>
  </button>
  <button type="button" data-route="profile">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span data-i18n="navProfile"></span>
  </button>
</nav>

<script>
/* ── SETTINGS: change these first ─────────────────────────── */
var BRAND_NAME = "Car Lottery";   // <- the client's name shown in the header and footer
var DEFAULT_LANG = "am";          // am = Amharic, om = Afaan Oromoo, en = English

/* ── TRANSLATIONS (one place for every word on screen) ────── */
var I18N = {
  am: {
    navHome:"መነሻ", navTickets:"ቲኬቶች", navProfile:"መገለጫ", back:"ተመለስ",
    homeTitle:"መኪኖች", homeSub:"ለመሳተፍ መኪና ይምረጡ",
    ticketsTitle:"የእኔ ቲኬቶች", ticketsSub:"የእርስዎን ግዢዎች ይከታተሉ",
    profileTitle:"መገለጫ", profileSub:"የእርስዎ መረጃ",
    rights:"ሁሉም መብቱ በህግ የተጠበቀ ነው።", theme:"ገጽታ"
  },
  om: {
    navHome:"Mana", navTickets:"Tikeetota", navProfile:"Piroofaayilii", back:"Deebi'i",
    homeTitle:"Konkolaattota", homeSub:"Konkolaataa filadhu",
    ticketsTitle:"Tikeetota koo", ticketsSub:"Bittaa kee hordofi",
    profileTitle:"Piroofaayilii", profileSub:"Odeeffannoo kee",
    rights:"Mirgi hundi eegamaadha.", theme:"Bifa"
  },
  en: {
    navHome:"Home", navTickets:"Tickets", navProfile:"Profile", back:"Back",
    homeTitle:"Cars", homeSub:"Pick a car to join the draw",
    ticketsTitle:"My tickets", ticketsSub:"Follow your purchases",
    profileTitle:"Profile", profileSub:"Your details",
    rights:"All rights reserved.", theme:"Theme"
  }
};

/* ── SMALL HELPERS ─────────────────────────────────────────── */
var ROUTES = ["home","tickets","profile"];
function load(key, fallback){ try{ return localStorage.getItem(key) || fallback; }catch(e){ return fallback; } }
function save(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

var state = {
  lang: I18N[load("lang", DEFAULT_LANG)] ? load("lang", DEFAULT_LANG) : DEFAULT_LANG,
  theme: load("theme", "dark") === "light" ? "light" : "dark"
};

var SUN  = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';

/* ── RENDER: language + theme ──────────────────────────────── */
function applyLanguage(){
  var dict = I18N[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = dict[el.getAttribute("data-i18n")] || "";
  });
  document.getElementById("langSelect").value = state.lang;
  document.getElementById("brandName").textContent = BRAND_NAME;
  document.getElementById("footer").textContent = "\u00A9 2026 " + BRAND_NAME + ". " + dict.rights;
  document.getElementById("themeBtn").setAttribute("aria-label", dict.theme);
  document.title = BRAND_NAME;
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
  document.getElementById("themeBtn").innerHTML = state.theme === "dark" ? SUN : MOON;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", state.theme === "dark" ? "#0d0d0d" : "#f5f5f4");
}

/* ── ROUTER: #home  #tickets  #profile ─────────────────────── */
function currentRoute(){
  var r = location.hash.replace("#", "");
  return ROUTES.indexOf(r) > -1 ? r : "home";
}
function render(){
  var route = currentRoute();
  ROUTES.forEach(function(r){
    document.getElementById("view-" + r).classList.toggle("is-active", r === route);
  });
  document.querySelectorAll("#nav button").forEach(function(b){
    if(b.getAttribute("data-route") === route) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  document.getElementById("backBtn").hidden = (route === "home");
  window.scrollTo(0, 0);
}
function go(route){ location.hash = route; }

/* ── EVENTS ────────────────────────────────────────────────── */
document.querySelectorAll("#nav button").forEach(function(b){
  b.addEventListener("click", function(){ go(b.getAttribute("data-route")); });
});
document.getElementById("backBtn").addEventListener("click", function(){ go("home"); });
document.getElementById("langSelect").addEventListener("change", function(e){
  state.lang = e.target.value; save("lang", state.lang); applyLanguage();
});
document.getElementById("themeBtn").addEventListener("click", function(){
  state.theme = state.theme === "dark" ? "light" : "dark"; save("theme", state.theme); applyTheme();
});
window.addEventListener("hashchange", render);

/* ── START ─────────────────────────────────────────────────── */
applyTheme();
applyLanguage();
render();
</script>
</body>
</html>
