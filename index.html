<!DOCTYPE html>
<html lang="am" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Car Lottery</title>
<meta name="description" content="Car Lottery">
<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────── */
:root{
  --bg:#0d0d0d; --surface:#1b1b1b; --surface-2:#262626; --line:#2c2c2c;
  --text:#f4f4f4; --muted:#8d8d8d;
  --amber:#f5a623; --amber-text:#f5a623; --amber-ink:#1a1100; --amber-tint:rgba(245,166,35,.14);
  --leaf:#1fa971; --lime:#a3d63a;
  --radius:20px; --radius-sm:14px;
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Abyssinica SIL",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f5f5f4; --surface:#ffffff; --surface-2:#ececea; --line:#dedcd8;
  --text:#161616; --muted:#6b6b6b;
  --amber:#f5a623; --amber-text:#a35f00; --amber-ink:#1a1100; --amber-tint:rgba(245,166,35,.16);
  --lime:#5a7d0e;
}

/* ── BASE ──────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── HEADER ────────────────────────────────────────────────── */
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand-mark{flex:none;width:46px;height:46px;border-radius:14px;background:var(--amber);color:var(--amber-ink);
  display:grid;place-items:center}
.brand-name{font-weight:700;font-size:17px;line-height:1.15;color:var(--amber-text);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{position:relative;flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px}
.pill .code{font-weight:700;min-width:2ch;text-align:center}
.pill .chev{color:var(--muted)}
.pill select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
  appearance:none;-webkit-appearance:none;border:0;background:transparent}
.pill:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--amber-text);cursor:pointer}
.icon-btn:active{transform:scale(.94)}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── PAGE AREA ─────────────────────────────────────────────── */
main{padding:4px 16px 150px;max-width:640px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;margin-bottom:6px;
  background:none;border:0;color:var(--muted);cursor:pointer;font-weight:500}
.back[hidden]{display:none}
.view{display:none}
.view.is-active{display:block}
.view h1{margin:6px 0 4px;font-size:26px;line-height:1.2}
.view .sub{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.scaffold{border-style:dashed;color:var(--muted);text-align:center;padding:36px 20px}
.cars{display:grid;gap:12px}
.car{display:flex;align-items:center;gap:14px;padding:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius)}
.car-img{flex:none;width:96px;height:96px;border-radius:14px;background:var(--surface-2);
  display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.car-img img{width:100%;height:100%;object-fit:cover}
.car-body{min-width:0;flex:1}
.car-title{font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.car-sub{color:var(--lime);font-size:14px;margin-top:2px}
.car-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:8px}
.car-price{color:var(--amber-text);font-weight:800;font-size:18px}
.car-sold{color:var(--muted);font-size:13px}
.note{text-align:center;color:var(--muted)}
.note p{margin:0 0 14px}
.btn{min-height:44px;padding:0 22px;border:0;border-radius:var(--radius-sm);background:var(--amber);
  color:var(--amber-ink);font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.skeleton .car-img,.skeleton .sk{background:var(--surface-2);animation:pulse 1.4s ease-in-out infinite}
.sk{height:14px;border-radius:7px;margin:8px 0}
@keyframes pulse{50%{opacity:.45}}
.car{cursor:pointer}
.car:active{transform:scale(.99)}

/* ── CAR DETAIL ────────────────────────────────────────────── */
.hero{position:relative;border-radius:var(--radius);background:#fff;overflow:hidden;aspect-ratio:3/2;display:grid;place-items:center;color:#999}
.hero img{width:100%;height:100%;object-fit:contain}
.d-title{margin:18px 0 2px;font-size:28px;line-height:1.15;font-weight:800;overflow-wrap:anywhere}
.d-sub{color:var(--lime);font-size:18px;font-weight:600;margin:0 0 16px}
.timer{background:rgba(31,169,113,.12);border:1px solid rgba(31,169,113,.35);border-radius:var(--radius);padding:14px 14px 12px}
.timer-title{color:var(--amber-text);font-weight:600;margin:0 0 10px}
.timer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t-cell{text-align:center}
.t-num{display:block;background:rgba(0,0,0,.35);border-radius:14px;padding:12px 0;font-size:28px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
:root[data-theme="light"] .t-num{background:rgba(0,0,0,.07);color:var(--amber-text)}
.t-lbl{display:block;margin-top:6px;font-size:12px;color:var(--amber-text)}
.prog-row{display:flex;justify-content:space-between;gap:10px;margin:20px 0 8px;font-size:15px;color:var(--muted)}
.prog-row b{color:var(--leaf);font-weight:700}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#2ed39a);border-radius:999px}
.left-note{margin:8px 0 0;font-size:14px;color:var(--muted)}
.buy-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 8px}
.buy-label{color:var(--muted);font-size:15px}
.buy-price{color:var(--amber-text);font-weight:800;font-size:26px}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:52px;height:52px;border:0;border-radius:14px;font-size:26px;font-weight:700;cursor:pointer;background:var(--surface-2);color:var(--text)}
.qty button.plus{background:var(--amber);color:var(--amber-ink)}
.qty button:disabled{opacity:.4;cursor:default}
.qty output{min-width:2ch;text-align:center;font-size:22px;font-weight:700}
.total-row{display:flex;justify-content:space-between;margin:14px 0 14px;padding-top:14px;border-top:1px solid var(--line);font-weight:700}
.total-row span:last-child{color:var(--amber-text)}
.btn.wide{width:100%;min-height:54px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}

/* ── PICKER + BUY SHEET ────────────────────────────────────── */
.err{color:#ff7a7a;margin:12px 0 0;font-size:14px;line-height:1.4}
.btn.outline{background:transparent;border:2px solid var(--amber);color:var(--amber-text)}
.btn.green{background:linear-gradient(90deg,#1b8f62,#2ed39a);color:#04170f}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.act-row .btn{min-height:54px;font-size:16px}
.sel-wrap{margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--amber);color:var(--amber-ink);font-weight:800;border-radius:10px;padding:6px 12px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg);
  border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0}
.sheet-head{padding:20px 20px 0}
.sheet-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:22px;line-height:1.25}
.sub-line{margin-top:4px;color:var(--muted);font-size:15px}
.tools{display:flex;gap:10px;flex:none}
.tools .icon-btn{border-radius:14px}
.tools .icon-btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.steps i{height:5px;border-radius:5px;background:var(--surface-2)}
.steps i.on{background:var(--amber)}
.sheet-body{overflow-y:auto;padding:16px 20px;flex:1;min-height:120px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1;min-height:54px;font-size:16px}
.sheet-foot .btn.ghost{flex:0 0 36%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;background:var(--surface-2)}
.legend i.s{background:var(--amber)} .legend i.t{background:#5a1a1a}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.num{height:44px;padding:0;border:0;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;background:var(--surface-2);color:var(--text)}
.num.taken{background:#5a1a1a;color:#e8b4b4;cursor:default}
.num.sel{background:var(--amber);color:var(--amber-ink)}
.sum{margin-bottom:18px}
.sum-name{font-weight:800;font-size:18px}
.field{display:block;margin:0 0 16px}
.field>span{display:block;margin-bottom:8px;font-weight:600}
.input{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.bank{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer}
.bank.on{border-color:var(--amber);background:var(--amber-tint)}
.bank-info{flex:1;min-width:0}
.bank-name{font-weight:700}
.bank-holder{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank-num{font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all;text-align:right;max-width:46%}
.copy{flex:none;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-weight:600;cursor:pointer}
.drop{display:block;text-align:center;padding:26px 14px;margin:0 0 16px;border:2px dashed var(--amber);border-radius:var(--radius);cursor:pointer;color:var(--text)}
.drop small{display:block;margin-top:6px;color:var(--muted)}
.drop b{display:block;margin-top:8px;color:var(--leaf);word-break:break-all}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.done-box{text-align:center;padding:28px 0}
.done-mark{width:84px;height:84px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:rgba(31,169,113,.15);border:1px solid rgba(31,169,113,.5);color:var(--leaf)}
.done-box p{margin:8px 0 0;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:36px 0 0}

/* ── BOTTOM NAV ────────────────────────────────────────────── */
.nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:608px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;min-height:64px;
  background:transparent;border:1px solid transparent;border-radius:20px;color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.nav button[aria-current="page"]{background:var(--amber-tint);border-color:var(--amber);color:var(--amber-text)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</nav>

function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = text;   // textContent = safe, never HTML
  return n;
}
function formatNumber(n){ return Number(n || 0).toLocaleString("en-US"); }

function loadCars(){
  carsState = { status: "loading", rows: [] };
  renderCars();
  if(typeof fetch !== "function"){ carsState = { status: "error", rows: [] }; renderCars(); return; }
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, CARS_TIMEOUT_MS);
  var url = SUPABASE_URL + "/rest/v1/cars"
    + "?select=id,name,subtitle,ticket_price,total_tickets,sold_tickets,image_url,ends_at"
    + "&is_active=eq.true&order=id.asc";
  fetch(url, { headers: { apikey: SUPABASE_KEY }, signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(rows){
      clearTimeout(timer);
      carsState = { status: "ready", rows: Array.isArray(rows) ? rows : [] };
      renderCars();
    })
    .catch(function(){
      clearTimeout(timer);
      carsState = { status: "error", rows: [] };
      renderCars();
    });
}

function carCard(car, dict){
  var item = el("div", "car");
  item.setAttribute("role", "link"); item.tabIndex = 0;
  item.addEventListener("click", function(){ go("car-" + car.id); });
  item.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go("car-" + car.id); } });
  var pic = el("div", "car-img");
  if(car.image_url){
    var im = document.createElement("img");
    im.alt = ""; im.loading = "lazy"; im.src = car.image_url;
    im.addEventListener("error", function(){ im.remove(); pic.innerHTML = CAR_ICON; });
    pic.appendChild(im);
  } else {
    pic.innerHTML = CAR_ICON;
  }
  var body = el("div", "car-body");
  body.appendChild(el("div", "car-title", car.name));
  if(car.subtitle) body.appendChild(el("div", "car-sub", car.subtitle));
  var meta = el("div", "car-meta");
  meta.appendChild(el("span", "car-price", formatNumber(car.ticket_price) + " " + dict.birr));
  meta.appendChild(el("span", "car-sold", dict.sold + " " + formatNumber(car.sold_tickets) + "/" + formatNumber(car.total_tickets)));
  body.appendChild(meta);
  item.appendChild(pic); item.appendChild(body);
  return item;
}

function renderCars(){ renderCarList(); renderCarDetail(); }
function renderCarList(){
  var box = document.getElementById("carList");
  if(!box) return;
  var dict = I18N[state.lang];
  box.textContent = "";
  if(carsState.status === "loading"){
    box.setAttribute("aria-busy", "true");
    for(var i = 0; i < 3; i++){
      var sk = el("div", "car skeleton");
      sk.appendChild(el("div", "car-img"));
      var b = el("div", "car-body");
      b.appendChild(el("div", "sk")); b.appendChild(el("div", "sk")); b.appendChild(el("div", "sk"));
      sk.appendChild(b); box.appendChild(sk);
    }
    return;
  }
  box.removeAttribute("aria-busy");
  if(carsState.status === "error"){
    var c = el("div", "card note");
    c.appendChild(el("p", "", dict.loadError));
    var btn = el("button", "btn", dict.retry);
    btn.type = "button";
    btn.addEventListener("click", loadCars);
    c.appendChild(btn); box.appendChild(c);
    return;
  }
  if(!carsState.rows.length){ box.appendChild(el("div", "card note", dict.noCars)); return; }
  carsState.rows.forEach(function(car){ box.appendChild(carCard(car, dict)); });
}


/* ── CAR DETAIL: #car-<id> ─────────────────────────────────── */
var detailTimer = null;
var detail = { carId: null, qty: 1, selected: [], msg: "" };
function pad2(n){ return (n < 10 ? "0" : "") + n; }

function renderCarDetail(){
  var box = document.getElementById("carDetail");
  if(!box) return;
  if(detailTimer){ clearInterval(detailTimer); detailTimer = null; }
  var p = parseHash();
  box.textContent = "";
  if(p.route !== "car") return;
  var dict = I18N[state.lang];

  if(carsState.status === "loading"){
    var sk = el("div", "card skeleton");
    sk.appendChild(el("div", "sk")); sk.appendChild(el("div", "sk")); sk.appendChild(el("div", "sk"));
    box.appendChild(sk); return;
  }
  var car = null;
  carsState.rows.forEach(function(r){ if(r.id === p.id) car = r; });
  if(carsState.status === "error" || !car){
    var c = el("div", "card note");
    c.appendChild(el("p", "", carsState.status === "error" ? dict.loadError : dict.carNotFound));
    var b = el("button", "btn", carsState.status === "error" ? dict.retry : dict.back);
    b.type = "button";
    b.addEventListener("click", function(){ if(carsState.status === "error") loadCars(); else go("home"); });
    c.appendChild(b); box.appendChild(c); return;
  }

  if(detail.carId !== car.id){ detail.carId = car.id; detail.qty = 1; detail.selected = []; }
  var flashMsg = detail.msg; detail.msg = "";
  var total = Number(car.total_tickets) || 0, sold = Number(car.sold_tickets) || 0;
  var left = Math.max(total - sold, 0);
  var pct = total ? Math.min(100, Math.floor(sold / total * 100)) : 0;
  var price = Number(car.ticket_price) || 0;
  if(detail.qty > left) detail.qty = Math.max(left, 1);

  // picture
  var hero = el("div", "hero");
  if(car.image_url){
    var im = document.createElement("img");
    im.alt = car.name; im.src = car.image_url;
    im.addEventListener("error", function(){ im.remove(); hero.innerHTML = CAR_ICON; });
    hero.appendChild(im);
  } else { hero.innerHTML = CAR_ICON; }
  box.appendChild(hero);

  // title
  box.appendChild(el("h1", "d-title", car.name));
  if(car.subtitle) box.appendChild(el("p", "d-sub", car.subtitle));

  // countdown
  var cells = [];
  var endMs = car.ends_at ? new Date(car.ends_at).getTime() : NaN;
  var hasEnd = !isNaN(endMs);
  if(hasEnd){
    var tm = el("div", "timer");
    tm.appendChild(el("p", "timer-title", dict.timeLeft));
    var grid = el("div", "timer-grid");
    [dict.days, dict.hours, dict.minutes, dict.seconds].forEach(function(label){
      var cell = el("div", "t-cell");
      var num = el("span", "t-num", "00");
      cell.appendChild(num); cell.appendChild(el("span", "t-lbl", label));
      grid.appendChild(cell); cells.push(num);
    });
    tm.appendChild(grid); box.appendChild(tm);
  }
  function tick(){
    var d = Math.max(endMs - Date.now(), 0), s = Math.floor(d / 1000);
    var vals = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
    for(var i = 0; i < 4; i++) cells[i].textContent = pad2(vals[i]);
    return d;
  }
  var closed = false;
  if(hasEnd){
    closed = tick() <= 0;
    if(!closed) detailTimer = setInterval(function(){ if(tick() <= 0){ clearInterval(detailTimer); detailTimer = null; renderCarDetail(); } }, 1000);
  }

  // progress
  var pr = el("div", "prog-row");
  pr.appendChild(el("span", "", formatNumber(sold) + " " + dict.sold));
  var pb = el("b", "", pct + "% " + dict.filled);
  pr.appendChild(pb); box.appendChild(pr);
  var bar = el("div", "bar"); bar.setAttribute("role", "progressbar");
  bar.setAttribute("aria-valuenow", pct); bar.setAttribute("aria-valuemin", 0); bar.setAttribute("aria-valuemax", 100);
  var fill = el("i"); fill.style.width = pct + "%"; bar.appendChild(fill); box.appendChild(bar);
  box.appendChild(el("p", "left-note", formatNumber(left) + " " + dict.ticketsLeft));

  // price + quantity
  var row = el("div", "buy-row");
  var pc = el("div");
  pc.appendChild(el("div", "buy-label", dict.ticketPrice));
  pc.appendChild(el("div", "buy-price", formatNumber(price) + " " + dict.birr));
  row.appendChild(pc);
  var q = el("div", "qty");
  var minus = el("button", "", "\u2212"); minus.type = "button"; minus.setAttribute("aria-label", "\u2212");
  var plus = el("button", "plus", "+");   plus.type = "button"; plus.setAttribute("aria-label", "+");
  var out = el("output", "", String(detail.qty));
  q.appendChild(minus); q.appendChild(out); q.appendChild(plus);
  row.appendChild(q); box.appendChild(row);

  var tot = el("div", "total-row");
  tot.appendChild(el("span", "", dict.total));
  var totVal = el("span", "", "");
  tot.appendChild(totVal); box.appendChild(tot);

  var unavailable = closed || left <= 0;
  if(detail.selected.length > detail.qty) detail.selected = detail.selected.slice(0, detail.qty);

  var chipsWrap = el("div", "sel-wrap");
  function drawChips(){
    chipsWrap.textContent = "";
    if(!detail.selected.length) return;
    chipsWrap.appendChild(el("div", "buy-label", dict.selectedNumbers));
    var cs = el("div", "chips");
    sortedSel().forEach(function(n){ cs.appendChild(el("span", "chip", String(n))); });
    chipsWrap.appendChild(cs);
  }
  box.appendChild(chipsWrap);
  if(flashMsg) box.appendChild(el("p", "err", flashMsg));

  var pickBtn = el("button", "btn outline wide", dict.chooseNumbers);
  pickBtn.type = "button"; pickBtn.disabled = unavailable;
  pickBtn.addEventListener("click", function(){ openPicker(""); });
  box.appendChild(pickBtn);

  var acts = el("div", "act-row");
  var quick = el("button", "btn", dict.quickPick); quick.type = "button"; quick.disabled = unavailable;
  quick.addEventListener("click", quickPick);
  var buyBtn = el("button", "btn green", closed ? dict.ended : (left <= 0 ? dict.soldOut : dict.buy));
  buyBtn.type = "button"; buyBtn.disabled = unavailable;
  buyBtn.addEventListener("click", openFlow);
  acts.appendChild(quick); acts.appendChild(buyBtn); box.appendChild(acts);

  function sync(){
    out.textContent = detail.qty;
    totVal.textContent = formatNumber(detail.qty * price) + " " + dict.birr;
    minus.disabled = detail.qty <= 1 || unavailable;
    plus.disabled = detail.qty >= left || unavailable;
    drawChips();
  }
  minus.addEventListener("click", function(){
    if(detail.qty > 1){ detail.qty--; detail.selected = detail.selected.slice(0, detail.qty); sync(); }
  });
  plus.addEventListener("click", function(){ if(detail.qty < left){ detail.qty++; sync(); } });
  sync();
}


/* ── BUYING: helpers ───────────────────────────────────────── */
function fmt(str, o){ return String(str).replace(/\{(\w+)\}/g, function(m, k){ return o[k] !== undefined ? o[k] : m; }); }
function sortedSel(){ return detail.selected.slice().sort(function(a, b){ return a - b; }); }
function currentCar(){
  var found = null;
  carsState.rows.forEach(function(r){ if(r.id === detail.carId) found = r; });
  return found;
}
function normPhone(p){
  var d = String(p || "").replace(/\D/g, "");
  if(d.indexOf("251") === 0 && d.length === 12) d = "0" + d.slice(3);
  else if(d.length === 9) d = "0" + d;
  return d;
}
function rpc(name, args){
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  }).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if(!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
      return j;
    });
  });
}
function uploadProof(path, file){
  return fetch(SUPABASE_URL + "/storage/v1/object/payment-proofs/" + path, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": file.type, "x-upsert": "false" },
    body: file
  }).then(function(r){ if(!r.ok) throw new Error("upload_failed"); });
}
var ERR_KEYS = { invalid_name:"errName", invalid_phone:"errPhone", numbers_taken:"errTaken", draw_closed:"errClosed",
  car_not_found:"errClosed", order_not_found:"errExpired", upload_failed:"errUpload" };
function errText(e){
  var d = I18N[state.lang], k = ERR_KEYS[e && e.message];
  if(k) return d[k];
  if(e && e.name === "TypeError") return d.errNetwork;
  return d.errGeneric;
}
function fetchTaken(carId){
  return rpc("get_taken_numbers", { p_car_id: carId }).then(function(arr){
    var map = {}; (Array.isArray(arr) ? arr : []).forEach(function(n){ map[n] = true; }); return map;
  });
}
function randomFree(total, taken, qty){
  var free = [];
  for(var i = 1; i <= total; i++) if(!taken[i]) free.push(i);
  for(var k = 0; k < qty && k < free.length; k++){
    var j = k + Math.floor(Math.random() * (free.length - k));
    var t = free[k]; free[k] = free[j]; free[j] = t;
  }
  return free.slice(0, qty);
}
function quickPick(){
  var car = currentCar(); if(!car) return;
  fetchTaken(car.id).then(function(taken){
    var picks = randomFree(Number(car.total_tickets) || 0, taken, detail.qty);
    if(picks.length < detail.qty) detail.msg = I18N[state.lang].soldOut; else detail.selected = picks;
    renderCarDetail();
  }).catch(function(e){ detail.msg = errText(e); renderCarDetail(); });
}

/* ── BOTTOM SHEET (shared by picker + buy flow) ───────────── */
var overlay = document.getElementById("overlay");
var sheet = document.getElementById("sheet");
var sheetRender = null;
var X_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var SHUFFLE_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>';
function openOverlay(){ overlay.hidden = false; document.body.style.overflow = "hidden"; }
function closeOverlay(){
  overlay.hidden = true; document.body.style.overflow = ""; sheet.textContent = ""; sheetRender = null;
  if(currentRoute() === "car") renderCarDetail();
}
overlay.addEventListener("click", function(e){ if(e.target === overlay) closeOverlay(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !overlay.hidden) closeOverlay(); });

function iconBtn(svg, label, extra, onClick){
  var b = el("button", "icon-btn" + (extra ? " " + extra : "")); b.type = "button";
  b.setAttribute("aria-label", label); b.innerHTML = svg; b.addEventListener("click", onClick); return b;
}
function sheetFrame(o){
  sheet.textContent = "";
  var head = el("div", "sheet-head"), row = el("div", "sheet-title-row"), left = el("div");
  left.appendChild(el("h2", "", o.title));
  if(o.sub) left.appendChild(o.sub);
  var tools = el("div", "tools");
  (o.tools || []).forEach(function(t){ tools.appendChild(t); });
  tools.appendChild(iconBtn(X_SVG, "Close", "", closeOverlay));
  row.appendChild(left); row.appendChild(tools); head.appendChild(row);
  if(o.step){
    var st = el("div", "steps");
    for(var i = 1; i <= 3; i++){ var seg = el("i"); if(i <= o.step) seg.className = "on"; st.appendChild(seg); }
    head.appendChild(st);
  }
  var body = el("div", "sheet-body"); body.appendChild(o.body);
  var foot = el("div", "sheet-foot"); (o.foot || []).forEach(function(f){ foot.appendChild(f); });
  sheet.appendChild(head); sheet.appendChild(body); sheet.appendChild(foot);
}
function mkBtn(cls, text, onClick, disabled){
  var b = el("button", "btn " + cls, text); b.type = "button"; b.disabled = !!disabled;
  if(onClick) b.addEventListener("click", onClick); return b;
}

/* ── NUMBER PICKER ─────────────────────────────────────────── */
var picker = { taken: null, msg: "", failed: false };
function openPicker(msg){
  var car = currentCar(); if(!car) return;
  picker.taken = null; picker.msg = msg || ""; picker.failed = false;
  openOverlay(); renderPicker();
  fetchTaken(car.id).then(function(map){
    picker.taken = map;
    detail.selected = detail.selected.filter(function(n){ return !map[n]; });
    if(sheetRender === renderPicker) renderPicker();
  }).catch(function(e){ picker.failed = true; picker.msg = errText(e); if(sheetRender === renderPicker) renderPicker(); });
}
function renderPicker(){
  sheetRender = renderPicker;
  var car = currentCar(); if(!car){ closeOverlay(); return; }
  var d = I18N[state.lang], total = Number(car.total_tickets) || 0;
  var body = el("div");
  var lg = el("div", "legend");
  [["s", d.legendSelected], ["", d.legendFree], ["t", d.legendTaken]].forEach(function(x){
    var sp = el("span"); sp.appendChild(el("i", x[0])); sp.appendChild(document.createTextNode(x[1])); lg.appendChild(sp);
  });
  body.appendChild(lg);
  if(picker.msg) body.appendChild(el("p", "err", picker.msg));
  var grid = null;
  if(picker.taken === null && !picker.failed){
    body.appendChild(el("p", "sub-line", d.loadingNumbers));
  } else if(picker.taken){
    grid = el("div", "grid");
    var html = "";
    for(var i = 1; i <= total; i++){
      var cls = picker.taken[i] ? " taken" : (detail.selected.indexOf(i) > -1 ? " sel" : "");
      html += '<button type="button" class="num' + cls + '" data-n="' + i + '">' + (i < 100 ? ("00" + i).slice(-3) : i) + '</button>';
    }
    grid.innerHTML = html;                       // numbers only, safe
    body.appendChild(grid);
  }
  var sub = el("div", "sub-line"), doneBtn = mkBtn("green", "", closeOverlay, true);
  function update(){
    var sel = detail.selected.length, q = detail.qty;
    sub.textContent = fmt(d.pickSub, { q: q, s: sel });
    doneBtn.disabled = sel < q;
    doneBtn.textContent = sel < q ? fmt(d.selectMore, { n: q - sel }) : d.done;
  }
  function paint(){
    if(!grid) return;
    Array.prototype.forEach.call(grid.children, function(b){
      if(!b.classList.contains("taken")) b.classList.toggle("sel", detail.selected.indexOf(Number(b.dataset.n)) > -1);
    });
  }
  if(grid) grid.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".num") : null;
    if(!b || b.classList.contains("taken")) return;
    var n = Number(b.dataset.n), i = detail.selected.indexOf(n);
    if(i > -1) detail.selected.splice(i, 1);
    else { if(detail.selected.length >= detail.qty) detail.selected.shift(); detail.selected.push(n); }
    paint(); update();
  });
  var shuffle = iconBtn(SHUFFLE_SVG, d.quickPick, "amber", function(){
    if(!picker.taken) return;
    var picks = randomFree(total, picker.taken, detail.qty);
    if(picks.length === detail.qty){ detail.selected = picks; paint(); update(); }
  });
  sheetFrame({ title: d.pickTitle, sub: sub, tools: [shuffle], body: body, foot: [doneBtn] });
  update();
}

/* ── BUY FLOW (3 steps) ────────────────────────────────────── */
var flow = { step: 1, orderId: null, key: "", name: "", phone: "", bank: "", paidFrom: "", file: null, msg: "", busy: false };
function selKey(){ return detail.carId + ":" + sortedSel().join(","); }
function openFlow(){
  if(!currentCar()) return;
  if(detail.selected.length !== detail.qty){ openPicker(""); return; }
  if(!(flow.orderId && flow.key === selKey())){ flow.orderId = null; flow.file = null; flow.bank = ""; flow.paidFrom = ""; }
  flow.key = selKey(); flow.msg = ""; flow.busy = false;
  if(!flow.name) flow.name = load("name", "");
  if(!flow.phone) flow.phone = load("phone", "");
  flow.step = flow.orderId ? 2 : 1;
  openOverlay(); renderFlow();
}
function field(label, type, ph, value, onInput, auto){
  var wrap = el("label", "field"); wrap.appendChild(el("span", "", label));
  var inp = el("input", "input"); inp.type = type; inp.placeholder = ph; inp.value = value; inp.autocomplete = auto || "off";
  if(type === "tel") inp.setAttribute("inputmode", "tel");
  inp.addEventListener("input", function(){ onInput(inp.value); });
  wrap.appendChild(inp); return wrap;
}
function renderFlow(){
  sheetRender = renderFlow;
  var car = currentCar(); if(!car){ closeOverlay(); return; }
  var d = I18N[state.lang], price = Number(car.ticket_price) || 0;
  var count = flow.step === 3 ? 0 : detail.selected.length;
  var body = el("div"), foot = [];
  var stepSub = el("div", "sub-line", fmt(d.stepOf, { s: flow.step }));

  if(flow.step === 1){
    var sum = el("div", "card sum");
    sum.appendChild(el("div", "sum-name", car.name));
    sum.appendChild(el("div", "buy-label", count + " " + d.ticketsWord + " \u00D7 " + formatNumber(price) + " " + d.birr));
    sum.appendChild(el("div", "buy-price", formatNumber(count * price) + " " + d.birr));
    var cs = el("div", "chips");
    sortedSel().forEach(function(n){ cs.appendChild(el("span", "chip", String(n))); });
    sum.appendChild(cs); body.appendChild(sum);
    body.appendChild(field(d.fullName, "text", d.fullNamePh, flow.name, function(v){ flow.name = v; }, "name"));
    body.appendChild(field(d.phone, "tel", d.phonePh, flow.phone, function(v){ flow.phone = v; }, "tel"));
    if(flow.msg) body.appendChild(el("p", "err", flow.msg));
    foot = [mkBtn("ghost", d.back, closeOverlay), mkBtn("green", flow.busy ? "\u2026" : d.continueBtn, submitStep1, flow.busy)];
  }

  if(flow.step === 2){
    var total = flow.orderTotal || (flow.key ? sortedSel().length * price : 0);
    body.appendChild(el("p", "buy-label", fmt(d.sendTo, { amount: formatNumber(total) })));
    body.appendChild(el("p", "sub-line", d.bankOptional));
    var cards = [];
    BANK_ACCOUNTS.forEach(function(b){
      var card = el("div", "bank" + (flow.bank === b.bank ? " on" : "")); card.tabIndex = 0; card.setAttribute("role", "button");
      var info = el("div", "bank-info"); info.appendChild(el("div", "bank-name", b.bank)); info.appendChild(el("div", "bank-holder", b.holder));
      var cp = el("button", "copy", d.copy); cp.type = "button";
      cp.addEventListener("click", function(e){
        e.stopPropagation();
        try{ navigator.clipboard.writeText(b.number); cp.textContent = d.copied; }catch(x){}
      });
      card.appendChild(info); card.appendChild(el("div", "bank-num", b.number)); card.appendChild(cp);
      function choose(){ flow.bank = b.bank; cards.forEach(function(c){ c.el.classList.toggle("on", c.bank === b.bank); }); }
      card.addEventListener("click", choose);
      card.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); choose(); } });
      cards.push({ el: card, bank: b.bank }); body.appendChild(card);
    });
    body.appendChild(el("p", "buy-label", d.proofLabel));
    var drop = el("label", "drop");
    var fi = el("input"); fi.type = "file"; fi.accept = "image/png,image/jpeg";
    drop.appendChild(fi); drop.appendChild(el("span", "", d.proofUpload)); drop.appendChild(el("small", "", d.proofHint));
    var fname = el("b", "", flow.file ? flow.file.name : ""); drop.appendChild(fname);
    var nextBtn = mkBtn("green", flow.busy ? "\u2026" : d.continueBtn, submitStep2, flow.busy || !flow.file);
    fi.addEventListener("change", function(){
      var f = fi.files && fi.files[0];
      if(!f) return;
      if((f.type !== "image/png" && f.type !== "image/jpeg") || f.size > 10 * 1024 * 1024){
        flow.file = null; fname.textContent = ""; errBox.textContent = d.errFile; nextBtn.disabled = true; return;
      }
      flow.file = f; fname.textContent = f.name; errBox.textContent = ""; nextBtn.disabled = flow.busy;
    });
    body.appendChild(drop);
    body.appendChild(field(d.paidFrom, "text", "", flow.paidFrom, function(v){ flow.paidFrom = v; }, "off"));
    var errBox = el("p", "err", flow.msg); body.appendChild(errBox);
    foot = [mkBtn("ghost", d.back, closeOverlay), nextBtn];
  }

  if(flow.step === 3){
    var dn = el("div", "done-box");
    var mark = el("div", "done-mark");
    mark.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    dn.appendChild(mark); dn.appendChild(el("h2", "", d.receivedTitle)); dn.appendChild(el("p", "", d.receivedText));
    body.appendChild(dn);
    foot = [mkBtn("green", d.ok, function(){
      flow.orderId = null; flow.step = 1; flow.file = null; flow.key = "";
      closeOverlay(); loadCars();
    })];
  }
  sheetFrame({ title: d.buyTitle, sub: stepSub, step: flow.step, body: body, foot: foot });
}
function submitStep1(){
  var d = I18N[state.lang];
  if(flow.busy) return;
  flow.msg = "";
  if(flow.name.trim().length < 3){ flow.msg = d.errName; renderFlow(); return; }
  if(!/^0[79]\d{8}$/.test(normPhone(flow.phone))){ flow.msg = d.errPhone; renderFlow(); return; }
  flow.busy = true; renderFlow();
  var car = currentCar();
  rpc("create_order", { p_car_id: detail.carId, p_full_name: flow.name.trim(), p_phone: flow.phone, p_numbers: detail.selected })
    .then(function(id){
      flow.busy = false; flow.orderId = id; flow.step = 2;
      flow.orderTotal = detail.selected.length * (Number(car.ticket_price) || 0);
      save("name", flow.name.trim()); save("phone", normPhone(flow.phone));
      renderFlow();
    })
    .catch(function(e){
      flow.busy = false;
      if(e.message === "numbers_taken"){ detail.selected = []; flow.orderId = null; closeOverlay(); openPicker(d.errTaken); return; }
      flow.msg = errText(e); renderFlow();
    });
}
function submitStep2(){
  if(flow.busy || !flow.file) return;
  flow.busy = true; flow.msg = ""; renderFlow();
  var ext = flow.file.type === "image/png" ? "png" : "jpg";
  var path = flow.orderId + "/" + Date.now() + "." + ext;
  var note = [flow.bank ? "to: " + flow.bank : "", flow.paidFrom.trim() ? "from: " + flow.paidFrom.trim() : ""].filter(Boolean).join(" | ");
  uploadProof(path, flow.file)
    .then(function(){ return rpc("attach_payment", { p_order_id: flow.orderId, p_path: path, p_paid_from: note }); })
    .then(function(){ flow.busy = false; flow.step = 3; detail.selected = []; renderFlow(); })
    .catch(function(e){
      flow.busy = false;
      if(e.message === "order_not_found"){ flow.orderId = null; flow.step = 1; }
      flow.msg = errText(e); renderFlow();
    });
}

/* ── RENDER: language + theme ──────────────────────────────── */
function applyLanguage(){
  var dict = I18N[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = dict[el.getAttribute("data-i18n")] || "";
  });
  document.getElementById("langSelect").value = state.lang;
  document.getElementById("langCode").textContent = LANG_CODES[state.lang];
  document.getElementById("brandName").textContent = BRAND_NAME;
  document.getElementById("footer").textContent = "\u00A9 2026 " + BRAND_NAME + ". " + dict.rights;
  document.getElementById("themeBtn").setAttribute("aria-label", dict.theme);
  document.title = BRAND_NAME;
  renderCars();
  if(sheetRender && !overlay.hidden) sheetRender();
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
  document.getElementById("themeBtn").innerHTML = state.theme === "dark" ? SUN : MOON;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", state.theme === "dark" ? "#0d0d0d" : "#f5f5f4");
}

/* ── ROUTER: #home  #tickets  #profile ─────────────────────── */
function parseHash(){
  var h = location.hash.replace("#", "");
  var m = /^car-(\d+)$/.exec(h);                    // #car-3 = detail page of car id 3
  if(m) return { route: "car", id: Number(m[1]) };
  return { route: (h !== "car" && ROUTES.indexOf(h) > -1) ? h : "home", id: null };
}
function currentRoute(){ return parseHash().route; }
function render(){
  var route = currentRoute();
  ROUTES.forEach(function(r){
    document.getElementById("view-" + r).classList.toggle("is-active", r === route);
  });
  document.querySelectorAll("#nav button").forEach(function(b){
    if(b.getAttribute("data-route") === (route === "car" ? "home" : route)) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  document.getElementById("backBtn").hidden = (route === "home");
  renderCarDetail();
  window.scrollTo(0, 0);
}
function go(route){ location.hash = route; }

/* ── EVENTS ────────────────────────────────────────────────── */
document.querySelectorAll("#nav button").forEach(function(b){
  b.addEventListener("click", function(){ go(b.getAttribute("data-route")); });
});
document.getElementById("backBtn").addEventListener("click", function(){ go("home"); });
document.getElementById("langSelect").addEventListener("change", function(e){
  state.lang = e.target.value; save("lang", state.lang); applyLanguage();
});
document.getElementById("themeBtn").addEventListener("click", function(){
  state.theme = state.theme === "dark" ? "light" : "dark"; save("theme", state.theme); applyTheme();
});
window.addEventListener("hashchange", render);

/* ── START ─────────────────────────────────────────────────── */
applyTheme();
applyLanguage();
render();
loadCars();
</script>
</body>
</html>
